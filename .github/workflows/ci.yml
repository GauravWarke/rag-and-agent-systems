name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-support-knowledge-copilot
          - 06-agent-sandbox
          - 07-rag-freshness-monitor
          - 08-nl-to-api-assistant
          - 09-multimodal-doc-reviewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: ruff check .

      - name: Test
        working-directory: ${{ matrix.project }}
        run: pytest -q

      - name: Service starts and answers /health
        working-directory: ${{ matrix.project }}
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            sleep 1
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
          done
          echo "service did not become healthy"; exit 1

  site:
    name: docs site link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every relative link in docs/ resolves
        run: |
          python - <<'PY'
          import re, sys, pathlib
          from urllib.parse import unquote, urlsplit

          docs = pathlib.Path("docs")
          pages = sorted(docs.rglob("*.html"))
          broken, checked = [], 0
          for page in pages:
              html = page.read_text(encoding="utf-8", errors="ignore")
              # Capture the whole attribute, then strip ?query and #fragment.
              # The previous pattern only matched hrefs starting with "./" and
              # containing no "#", so "demo.html" and "./demo.html#top" were
              # never checked at all.
              for raw in re.findall(r'(?:href|src)="([^"]*)"', html):
                  parts = urlsplit(raw)
                  if parts.scheme or parts.netloc or not parts.path:
                      continue  # external, protocol-relative, or bare #anchor
                  path = unquote(parts.path)
                  base = docs if path.startswith("/") else page.parent
                  checked += 1
                  if not (base / path.lstrip("/")).resolve().exists():
                      broken.append(f"{page.relative_to(docs)} -> {raw}")
          if broken:
              print("Broken relative links:")
              for b in broken:
                  print("  " + b)
              sys.exit(1)
          print(f"OK - {checked} relative links across {len(pages)} pages all resolve")
          PY

  image:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 01 image
        run: docker build -t copilot-ci ./01-support-knowledge-copilot
