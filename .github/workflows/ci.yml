name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-support-knowledge-copilot
          - 06-agent-sandbox
          - 07-rag-freshness-monitor
          - 08-nl-to-api-assistant
          - 09-multimodal-doc-reviewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: ruff check .

      - name: Test
        working-directory: ${{ matrix.project }}
        run: pytest -q

      - name: Service starts and answers /health
        working-directory: ${{ matrix.project }}
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            sleep 1
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
          done
          echo "service did not become healthy"; exit 1

  site:
    name: docs site link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every relative link in docs/ resolves
        run: |
          python - <<'PY'
          import re, sys, pathlib
          docs = pathlib.Path("docs")
          broken = []
          for page in sorted(docs.glob("*.html")):
              html = page.read_text(encoding="utf-8", errors="ignore")
              for href in re.findall(r'href="(\./[^"#?]+)"', html):
                  target = (docs / href[2:]).resolve()
                  if not target.exists():
                      broken.append(f"{page.name} -> {href}")
          if broken:
              print("Broken relative links:")
              for b in broken:
                  print("  " + b)
              sys.exit(1)
          print(f"OK - checked {len(list(docs.glob('*.html')))} pages, no broken links")
          PY

  image:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 01 image
        run: docker build -t copilot-ci ./01-support-knowledge-copilot
