name: Claude ROADMAP Builder

on:
  schedule:
    - cron: "30 4 */2 * *"   # every 2 days, 10:00 AM IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  build-next-roadmap-item:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Claude implements the next ROADMAP item
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --allowedTools Edit,Read,Write,Bash,Glob,Grep
          prompt: |
            Advance this monorepo of 15 AI-engineering projects by exactly ONE ROADMAP item.

            1. Read ROADMAP.md at the repo root. Find the FIRST unchecked "- [ ]" item,
               top-to-bottom. If all are checked, make no changes and stop.
            2. Open the matching project folder (e.g. 01-support-knowledge-copilot/).
               Read its README and code and match conventions: Python 3.11+, FastAPI,
               Pydantic v2, offline-runnable keyless stubs (real providers behind env vars).
            3. Implement exactly that ONE item. Keep scope tight.
            4. Add or update tests, then inside the project folder run:
               pip install -r requirements-dev.txt
               ruff check .
               pytest -q
               Fix anything you broke. Do not finish while tests fail.
            5. Security check: no hardcoded secrets, server-side input validation,
               rate limiting on public endpoints, no committed .env files.
            6. Tick the item off ("- [x]") in ROADMAP.md.

            IMPORTANT: Only EDIT files in the working tree. Do NOT run git, do NOT create
            branches, do NOT commit, do NOT push, do NOT open a PR — a later workflow step
            handles all of that. Just leave your changes on disk. At the end, print a one-line
            summary of which ROADMAP item you implemented.

      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: builder/run-${{ github.run_id }}
          base: main
          commit-message: "build: advance ROADMAP (run ${{ github.run_id }})"
          title: "Automated build: next ROADMAP item (run ${{ github.run_id }})"
          body: |
            Automated build by the Claude ROADMAP Builder.

            This PR implements the next unchecked item in `ROADMAP.md`, with tests run
            (ruff + pytest) and a security pass. Review the diff and merge if it looks right.

            Triggered by: ${{ github.event_name }} · Run: ${{ github.run_id }}
          delete-branch: true
