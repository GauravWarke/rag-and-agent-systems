name: Claude ROADMAP Builder

on:
  schedule:
    - cron: "30 4 */2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  build-next-roadmap-item:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --max-turns 40
            --allowedTools Edit,Read,Write,Bash,Glob,Grep
          prompt: |
            Advance this monorepo of 15 AI-engineering projects by exactly ONE ROADMAP item.

            1. Read ROADMAP.md at the repo root. Find the FIRST unchecked "- [ ]" item,
               top-to-bottom. If all are checked, stop and do nothing.
            2. Open the matching project folder (e.g. 01-support-knowledge-copilot/).
               Read its README and code and match conventions: Python 3.11+, FastAPI,
               Pydantic v2, offline-runnable keyless stubs (real providers behind env vars).
            3. Implement exactly that ONE item. Keep scope tight.
            4. Add or update tests, then inside the project folder run:
               pip install -r requirements-dev.txt
               ruff check .
               pytest -q
               Fix anything you broke. Do not finish while tests fail.
            5. Security check: no hardcoded secrets, server-side input validation,
               rate limiting on public endpoints, no committed .env files.
            6. Tick the item off ("- [x]") in ROADMAP.md.
            7. Create a branch, commit, and open a pull request against the default branch.
               PR body: which item was built, summary, ruff and pytest results, follow-ups.

            RULES: One item per run. Never push to main. Never self-merge.
            Secrets only via env vars. If blocked, stop and explain rather than guessing.
