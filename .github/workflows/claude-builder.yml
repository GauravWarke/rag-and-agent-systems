name: Claude ROADMAP Builder

on:
  schedule:
    - cron: "30 4 * * *"   # every day, 10:00 AM IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  build-next-project:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Claude builds the next project
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools Edit,Read,Write,Bash,Glob,Grep
          prompt: |
            Advance this monorepo of 15 AI-engineering projects by completing ONE WHOLE PROJECT this run.

            1. Read ROADMAP.md at the repo root. Identify the FIRST project (P1..P15, in order) that
               still has ANY unchecked "- [ ]" items. Work ONLY on that single project this run.
               If every project is fully checked, make no changes and stop.
            2. Open that project's folder (e.g. 01-support-knowledge-copilot/). Read its README and
               code. Conventions: Python 3.11+, FastAPI, Pydantic v2, offline-runnable keyless stubs
               by default (real providers behind env vars), pytest + ruff.
            3. Implement EVERY remaining unchecked item for that one project, in order, phase by phase.
               Medium effort: correct, tested, readable code — simple working implementations, not
               gold-plating.
            4. After each item, tick it off ("- [x]") in ROADMAP.md so progress is saved.
            5. Add/update tests. Before finishing, inside the project folder, ensure these pass:
               pip install -r requirements-dev.txt ; ruff check . ; pytest -q
               Fix anything you broke. Do NOT finish with failing tests or lint errors — a CI gate
               re-runs them and will block the merge if they fail.
            6. Security: no hardcoded secrets, server-side input validation, rate limiting on public
               endpoints, no committed .env files.

            IMPORTANT: Only EDIT files in the working tree. Do NOT run git, branch, commit, push, or
            open a PR. If low on turns, stop cleanly with tests passing and ROADMAP checkboxes
            matching exactly what you finished. End with a one-line summary.

      - name: Verify — independent CI gate (ruff + pytest on changed projects)
        id: verify
        run: |
          set -e
          CHANGED=$(git status --porcelain | awk '{print $2}' | grep -oE '^[0-9]{2}-[^/]+' | sort -u || true)
          if [ -z "$CHANGED" ]; then
            echo "No project changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed projects: $CHANGED"
          for d in $CHANGED; do
            if [ -f "$d/requirements-dev.txt" ]; then
              echo "::group::Verifying $d"
              pip install -q -r "$d/requirements-dev.txt"
              ( cd "$d" && ruff check . && pytest -q )
              echo "::endgroup::"
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        id: cpr
        if: steps.verify.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: builder/run-${{ github.run_id }}
          base: main
          commit-message: "build: advance next project (run ${{ github.run_id }})"
          title: "Automated build: next project (run ${{ github.run_id }})"
          body: |
            Automated daily build by the Claude ROADMAP Builder.
            CI gate (ruff + pytest) passed before this PR was opened. Auto-merged after creation.

            Triggered by: ${{ github.event_name }} · Run: ${{ github.run_id }}
          delete-branch: true

      - name: Auto-merge the PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" \
            --squash --delete-branch \
            --repo "${{ github.repository }}"
