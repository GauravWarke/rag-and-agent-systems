# Per-team and per-feature spend limits. Teams/features not listed here
# fall back to `default`.
default:
  daily_limit_usd: 1.0
  monthly_limit_usd: 20.0

policies:
  - scope: team
    key: team-alpha
    daily_limit_usd: 5.0
    monthly_limit_usd: 100.0

  - scope: team
    key: team-beta
    daily_limit_usd: 2.0
    monthly_limit_usd: 40.0

  - scope: feature
    key: support-bot
    daily_limit_usd: 3.0
    monthly_limit_usd: 60.0
