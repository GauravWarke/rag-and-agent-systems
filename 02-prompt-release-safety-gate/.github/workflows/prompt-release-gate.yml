name: Prompt Release Gate (P2)

on:
  pull_request:
    paths:
      - "02-prompt-release-safety-gate/prompts/**"
      - "02-prompt-release-safety-gate/data/**"
      - "02-prompt-release-safety-gate/app/eval/**"

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-prompt-release-safety-gate
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Run release gate
        id: gate
        continue-on-error: true
        env:
          BASELINE_PROMPT: ${{ vars.BASELINE_PROMPT || 'crm_summary_v1' }}
          CANDIDATE_PROMPT: ${{ vars.CANDIDATE_PROMPT || 'crm_summary_v2' }}
        run: |
          python gate.py \
            --baseline "$BASELINE_PROMPT" \
            --candidate "$CANDIDATE_PROMPT" \
            --out reports \
            --report-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload release report artifact
        uses: actions/upload-artifact@v4
        with:
          name: prompt-release-report
          path: 02-prompt-release-safety-gate/reports/

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '02-prompt-release-safety-gate/reports/pr_comment.md';
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- prompt-release-gate -->';
            const comment = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Fail the job if the gate blocked the release
        if: steps.gate.outcome == 'failure'
        run: exit 1
