name: CI (P2 Prompt Release Safety Gate)

on:
  push:
    paths:
      - "02-prompt-release-safety-gate/**"
  pull_request:
    paths:
      - "02-prompt-release-safety-gate/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-prompt-release-safety-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt || true
