services:
  - type: web
    name: support-knowledge-copilot
    runtime: python
    plan: free
    rootDir: 01-support-knowledge-copilot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

