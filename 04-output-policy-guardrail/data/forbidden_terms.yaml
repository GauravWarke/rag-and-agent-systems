# Deterministic keyword/regex rules for policies that support cheap,
# clear-cut detection before an LLM judge call.
entries:
  - policy_id: toxic_language
    keywords:
      - "you're an idiot"
      - "you are an idiot"
      - "shut up"
      - "you're stupid"
      - "you are stupid"
      - "i hate you"
    regexes: []

  - policy_id: unsafe_instructions
    keywords:
      - "how to make a bomb"
      - "bypass the safety"
      - "ignore all previous instructions"
      - "how to hack into"
    regexes:
      - "(?i)step[- ]by[- ]step.{0,40}(bomb|explosive|weapon)"
